name: Smoke test published images

# Manual on-demand check that the published :latest images actually pull and
# run correctly — not just that they built. Runs all four on a shared docker
# network (nginx-proxy resolves the other three by hostname at container
# startup, so it needs them present to even start cleanly) and hits each
# service's /health endpoint directly, plus nginx-proxy's proxied routes.

on:
  workflow_dispatch:

jobs:
  smoke-test:
    name: Pull, run, and health-check published images
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PLATFORM_TOKEN }}

      - name: Create shared network
        run: docker network create app-net

      - name: Pull images
        run: |
          docker pull ghcr.io/platform-base-images/nodejs-api:latest
          docker pull ghcr.io/platform-base-images/python-api:latest
          docker pull ghcr.io/platform-base-images/java-api:latest
          docker pull ghcr.io/platform-base-images/nginx-proxy:latest

      - name: Run backend services
        run: |
          docker run -d --name nodejs-api --network app-net \
            -p 3000:3000 ghcr.io/platform-base-images/nodejs-api:latest
          docker run -d --name python-api --network app-net \
            -p 8000:8000 ghcr.io/platform-base-images/python-api:latest
          docker run -d --name java-api --network app-net \
            -p 8080:8080 ghcr.io/platform-base-images/java-api:latest

      - name: Wait for backends to become healthy
        run: |
          set -euo pipefail
          for svc in "nodejs-api:3000" "python-api:8000" "java-api:8080"; do
            name="${svc%%:*}"; port="${svc##*:}"
            echo "Waiting for ${name} on :${port}..."
            for i in $(seq 1 30); do
              if curl -sf "http://localhost:${port}/health" > /dev/null; then
                echo "  ${name} is up"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "  ${name} never became healthy"
                docker logs "${name}"
                exit 1
              fi
              sleep 2
            done
          done

      - name: Run nginx-proxy (depends on the backend hostnames resolving)
        run: |
          docker run -d --name nginx-proxy --network app-net \
            -p 8888:8080 ghcr.io/platform-base-images/nginx-proxy:latest
          for i in $(seq 1 15); do
            if curl -sf "http://localhost:8888/health" > /dev/null; then
              echo "nginx-proxy is up"
              break
            fi
            if [ "$i" -eq 15 ]; then
              echo "nginx-proxy never became healthy"
              docker logs nginx-proxy
              exit 1
            fi
            sleep 2
          done

      - name: Check direct health endpoints
        run: |
          set -euo pipefail
          echo "--- nodejs-api /health ---"; curl -sf http://localhost:3000/health; echo
          echo "--- python-api /health ---"; curl -sf http://localhost:8000/health; echo
          echo "--- java-api /health ---";   curl -sf http://localhost:8080/health; echo
          echo "--- nginx-proxy /health ---"; curl -sf http://localhost:8888/health; echo

      - name: Check nginx-proxy's proxied routes
        run: |
          set -euo pipefail
          echo "--- /nodejs/health via nginx-proxy ---"; curl -sf http://localhost:8888/nodejs/health; echo
          echo "--- /python/health via nginx-proxy ---"; curl -sf http://localhost:8888/python/health; echo
          echo "--- /java/health via nginx-proxy ---";   curl -sf http://localhost:8888/java/health; echo

      - name: Check each app's /api/items endpoint
        run: |
          set -euo pipefail
          echo "--- nodejs-api /api/items ---"; curl -sf http://localhost:3000/api/items; echo
          echo "--- python-api /api/items ---"; curl -sf http://localhost:8000/api/items; echo
          echo "--- java-api /api/items ---";   curl -sf http://localhost:8080/api/items; echo

      - name: Container logs (always, for diagnostics)
        if: always()
        run: |
          for c in nodejs-api python-api java-api nginx-proxy; do
            echo "=== ${c} logs ==="
            docker logs "$c" 2>&1 || true
          done

      - name: Clean up
        if: always()
        run: |
          docker rm -f nodejs-api python-api java-api nginx-proxy 2>/dev/null || true
          docker network rm app-net 2>/dev/null || true