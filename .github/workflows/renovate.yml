name: Renovate

on:
  repository_dispatch:
    types: [renovate-run]
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'  # daily at 05:00 UTC as fallback

permissions:
  contents: write
  pull-requests: write

jobs:
  renovate:
    name: Run Renovate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: renovatebot/github-action@c314dda4a9a93b08239ec978f2043b9a433b9ac4 # v46.3.0
        with:
          configurationFile: renovate.json
          token: ${{ secrets.PLATFORM_TOKEN }}
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_ENDPOINT: https://api.github.com/
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_HOST_RULES: |
            [{"matchHost":"ghcr.io","username":"x-access-token","password":"${{ secrets.PLATFORM_TOKEN }}"}]
          LOG_LEVEL: info
