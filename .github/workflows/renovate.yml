name: Renovate

on:
  repository_dispatch:
    types: [renovate-run]
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'  # daily at 05:00 UTC as fallback

permissions:
  contents: write
  pull-requests: write

jobs:
  renovate:
    name: Run Renovate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: renovatebot/github-action@22e0a16091fc706b04affe6ae53d5e3358ac4023 # v46.1.19
        with:
          configurationFile: renovate.json
          token: ${{ secrets.PLATFORM_TOKEN }}
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_ENDPOINT: https://api.github.com/
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_HOST_RULES: |
            [{"matchHost":"ghcr.io","username":"x-access-token","password":"${{ secrets.PLATFORM_TOKEN }}"}]
          LOG_LEVEL: info
