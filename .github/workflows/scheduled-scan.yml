name: Scheduled CVE Scan

# Nightly scan of all published app images in GHCR. Opens a GitHub Issue if
# new CVEs are found above the severity threshold. An emergency rebuild can be
# triggered by running the Release workflow manually.

on:
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC every night
  workflow_dispatch:
    inputs:
      severity:
        description: Minimum severity to alert on
        required: false
        default: CRITICAL,HIGH,MEDIUM
        type: string

permissions:
  contents: read
  packages: read
  issues: write
  actions: read

env:
  REGISTRY: ghcr.io
  ORG: platform-base-images
  SEVERITY: ${{ inputs.severity || 'CRITICAL,HIGH,MEDIUM' }}

jobs:
  scan:
    name: CVE Scan / ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - nodejs-api
          - python-api
          - java-api
          - nginx-proxy
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.app }}:latest

      - name: Trivy scan (JSON output)
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.app }}:latest
          format: json
          output: trivy-${{ matrix.app }}.json
          severity: ${{ env.SEVERITY }}
          ignore-unfixed: true
          exit-code: '1'

      - name: Parse scan results
        id: parse
        if: steps.trivy.outcome == 'failure'
        run: |
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-${{ matrix.app }}.json)
          HIGH=$(jq     '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")]     | length' trivy-${{ matrix.app }}.json)
          MEDIUM=$(jq   '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")]   | length' trivy-${{ matrix.app }}.json)
          echo "critical=$CRITICAL" >> "$GITHUB_OUTPUT"
          echo "high=$HIGH"         >> "$GITHUB_OUTPUT"
          echo "medium=$MEDIUM"     >> "$GITHUB_OUTPUT"

          if   [[ "$CRITICAL" -gt 0 ]]; then echo "label=critical" >> "$GITHUB_OUTPUT"
          elif [[ "$HIGH"     -gt 0 ]]; then echo "label=high"     >> "$GITHUB_OUTPUT"
          else                               echo "label=medium"   >> "$GITHUB_OUTPUT"
          fi

          TABLE=$(jq -r '
            .Results[]?.Vulnerabilities[]? |
            "| \(.VulnerabilityID) | \(.Severity) | \(.CVSS.nvd.V3Score // "N/A") | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion // "—") |"
          ' trivy-${{ matrix.app }}.json | sort -t'|' -k3 -rV | head -30)
          {
            echo 'table<<EOF'
            echo "$TABLE"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Open or update CVE issue
        if: steps.trivy.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const app      = '${{ matrix.app }}';
            const ref      = '${{ env.REGISTRY }}/${{ env.ORG }}/' + app + ':latest';
            const critical = '${{ steps.parse.outputs.critical }}';
            const high     = '${{ steps.parse.outputs.high }}';
            const medium   = '${{ steps.parse.outputs.medium }}';
            const label    = '${{ steps.parse.outputs.label }}';
            const table    = `${{ steps.parse.outputs.table }}`;

            const body = [
              `## CVE Alert — \`${ref}\``,
              '',
              `> **Scan date:** ${new Date().toISOString().slice(0, 10)}  `,
              `> **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
              '',
              `**Severity breakdown:** ${critical} Critical · ${high} High · ${medium} Medium`,
              '',
              '### Detected CVEs (top 30)',
              '',
              '| CVE ID | Severity | CVSS | Package | Installed | Fixed In |',
              '|--------|----------|------|---------|-----------|---------|',
              table,
              '',
              '### Remediation steps',
              '1. Update the base image digest in `apps/' + app + '/Dockerfile` to the latest patched version, or',
              '2. Trigger the Release workflow manually:',
              '   - Go to Actions → Release → Run workflow → select `' + app + '`',
              '3. Merge the resulting changes — CI will rebuild and re-attest the image.',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['cve', app],
              state: 'open',
            });

            if (existing.data.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
                title: `[${label.toUpperCase()}] CVEs detected in ${app}:latest (updated ${new Date().toISOString().slice(0,10)})`,
              });
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                labels: [label],
              });
              console.log(`Updated existing issue #${existing.data[0].number}`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[${label.toUpperCase()}] CVEs detected in ${app}:latest`,
                body,
                labels: ['cve', label, app, 'automated'],
              });
              console.log(`Opened issue #${issue.number}`);
            }

      - name: Upload scan artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-${{ matrix.app }}-${{ github.run_number }}
          path: trivy-${{ matrix.app }}.json
          if-no-files-found: ignore
          retention-days: 365

  close-resolved-issues:
    name: Close Resolved CVE Issues
    runs-on: ubuntu-latest
    needs: scan
    if: always()
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const apps = ['nodejs-api', 'python-api', 'java-api', 'nginx-proxy'];
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const cleanJobs = jobs.data.jobs.filter(j =>
              j.name.startsWith('CVE Scan /') && j.conclusion === 'success'
            );
            for (const job of cleanJobs) {
              const appName = job.name.replace('CVE Scan / ', '');
              const open = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['cve', appName],
                state: 'open',
              });
              for (const issue of open.data) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Scan on ${new Date().toISOString().slice(0,10)} returned no CVEs above threshold. Closing automatically.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'completed',
                });
              }
            }
