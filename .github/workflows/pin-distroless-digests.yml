name: Pin distroless digests

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  pin:
    name: Resolve and pin distroless digests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.PLATFORM_TOKEN }}

      - name: Install crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      - name: Resolve and write distroless digest pins
        run: |
          set -euo pipefail

          crane auth login ghcr.io \
            --username x-access-token \
            --password "${{ secrets.PLATFORM_TOKEN }}"

          # Only java-api still has a distroless runtime stage — nodejs-base and
          # python-base dropped theirs (Chainguard's distroless builds for both
          # were stuck on unpatched CVEs with no shell to work around it; see
          # platform-base-images/hardened-base). Don't add them back here.
          for dockerfile in apps/java-api/Dockerfile; do
            image=$(grep -m1 '^FROM ghcr\.io/platform-base-images/' "$dockerfile" \
              | sed 's|FROM ghcr\.io/platform-base-images/\([^:]*\):.*|\1|')

            version=$(grep -m1 '^FROM ghcr\.io/platform-base-images/' "$dockerfile" \
              | grep -oP '\d+\.\d+\.\d+(?=@)')

            [ -z "$version" ] && continue

            distroless_ref="ghcr.io/platform-base-images/${image}:${version}-distroless"
            digest=$(crane digest "$distroless_ref")

            sed -i \
              "s|ghcr\.io/platform-base-images/${image}:[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*-distroless\(@sha256:[a-f0-9]*\)\?|ghcr.io/platform-base-images/${image}:${version}-distroless@${digest}|g" \
              "$dockerfile"

            echo "  ${dockerfile}: ${image}:${version}-distroless@${digest}"
          done

          git diff --quiet && echo "All distroless stages already digest-pinned." && exit 0

          git config user.name "platform-images"
          git config user.email "platform-images@users.noreply.github.com"

          BRANCH="chore/pin-distroless-digests-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git add apps/*/Dockerfile
          git commit -m "chore: pin distroless runtime stages to digest"
          git push origin "$BRANCH"

          gh pr create \
            --title "chore: pin distroless runtime stages to digest" \
            --body $'Adds an @sha256 digest pin to java-api\'s distroless runtime FROM line (the only app with a distroless runtime stage — nodejs-base and python-base have no distroless variant currently). Previously only the builder stage was digest-pinned; this brings the runtime stage to the same level.\n\nAfter this PR merges, future digest updates are handled automatically by the sync-distroless workflow on every Renovate base-image PR.' \
            --base main \
            --head "$BRANCH"
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_TOKEN }}